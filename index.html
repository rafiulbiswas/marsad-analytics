<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSAD Analytics: web dashboard</title>
<!-- No web fonts: the page loads nothing from the internet, so your posts, your address and the fact that you opened
     it stay on your machine, and the page works offline. Arabic uses the fonts your system already has. -->
<style>
:root{--navy:#18354c;--navy2:#254760;--teal:#057c81;--teal-dark:#04666a;--teal-light:#e8f5f3;--bg:#f5f7f9;--white:#fff;--ink:#243543;--muted:#586a77;--border:#dce4e9;--shadow:0 2px 9px rgba(19,45,62,.05);--focus:#f19d3d;--amber:#9a5b00;--amber-bg:#fff4de;--amber-line:#f2dcaf;--grey-bg:#eef1f3;--ok-bg:#e6f4ea;--ok:#1e6b3a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,"Noto Naskh Arabic",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
[dir=rtl],.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--teal-dark)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin-top:0}
.appbar{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:16px;position:sticky;top:0;z-index:50}
.branding{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border:3px solid #4ec3b9;border-radius:50%;position:relative;flex:none}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff}
.brand-mark:before{top:2px;left:3px}.brand-mark:after{right:2px;bottom:3px}
.brand{font-size:22px;font-weight:800}.brand-sub{color:#c6d9e5;font-size:13px;margin-top:2px}
.top-right{display:flex;align-items:center;gap:12px;font-size:14px;color:#dfebf1}
.pill{border:1px solid rgba(255,255,255,.35);background:var(--navy);color:#eef6fa;padding:7px 12px;border-radius:18px;white-space:nowrap}
#engine{max-width:40vw;overflow:hidden;text-overflow:ellipsis}
#engine.ready{background:#0f6e64;border-color:#0f6e64;color:#fff}#engine.err{background:#c0392b;border-color:#c0392b}
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}
.nav-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:#637786;margin:16px 12px 8px}
.nav-button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:#344e5c;padding:10px 12px;border-radius:10px;min-height:50px;font-weight:700;margin-bottom:3px}
.nav-button .ico{width:26px;height:26px;flex:none;color:#637988}
.nav-button.active{color:#065f62;background:var(--teal-light);box-shadow:inset 4px 0 0 var(--teal)}
.nav-button.active .ico{color:var(--teal)}
.nav-button:hover:not(.active){background:#f4f7f8}
.nav-desc{font-size:12.5px;color:#4f6371;display:block;margin-top:2px;font-weight:400}
.nav-count{margin-left:auto;font-size:12px;color:#4f6371;font-weight:700}
.side-footer{margin:18px 8px 0;padding:14px 6px;border-top:1px solid var(--border);font-size:13px;color:#657783;line-height:1.6}
.side-footer b{color:var(--ink)}
.content{padding:24px 34px 60px;max-width:1500px;width:100%;margin:0 auto;min-width:0}
.eyebrow{font-size:13.5px;color:#69808d;font-weight:700;margin-bottom:8px}
.eyebrow a{color:#69808d;text-decoration:none}.eyebrow a:hover{text-decoration:underline}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{font-size:32px;line-height:1.15;letter-spacing:-.6px;color:#203b4f;margin:0 0 8px}
.page-lead{font-size:18px;color:var(--muted);margin-bottom:0;max-width:820px}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #a7bbc5;background:#fff;border-radius:9px;min-height:44px;padding:9px 16px;font-weight:700;color:#31566a;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f4f8fa}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.primary:hover{background:var(--teal-dark)}
.btn:disabled{opacity:.5;cursor:default}.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.info-line{margin:20px 0 16px;padding:12px 16px;border:1px solid #cce8e5;background:#edf8f6;color:#25595c;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:15px;flex-wrap:wrap}
.section-heading{font-size:22px;color:#203d51;margin:30px 0 6px}
.section-description{font-size:15.5px;color:#617583;margin:0 0 16px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.metric{padding:18px 20px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-height:108px}
.metric-label{font-size:15px;color:#536b7a;margin-bottom:8px}.metric-value{font-size:30px;font-weight:800;color:#1d3f52;line-height:1.1}
.metric-small{font-size:13.5px;margin-top:6px;color:#4f6371}.metric .date-value{font-size:20px}
.cards-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;min-width:0;margin-bottom:18px}
.cards-2 .panel{margin-bottom:0}
.panel-title{font-size:19px;font-weight:700;color:#243d50;margin:0 0 4px}
.panel-description{color:#687d89;font-size:14.5px;margin:0 0 12px}
.panel-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #edf0f2;flex-wrap:wrap}
.text-button{padding:6px 0;border:0;background:none;color:#006c73;font-weight:700;font-size:15px;min-height:36px}
.text-button:hover{text-decoration:underline}
.save-button{min-height:38px;padding:6px 12px;border:1px solid #c9dadc;border-radius:8px;color:#32616a;background:#fff;font-size:14px;font-weight:700}
.save-button.saved{color:#047475;background:#eaf6f2;border-color:#a4d2ce}
.summary-list{padding:0;margin:0;list-style:none}
.summary-list li{padding:12px 0;border-bottom:1px solid #edf0f2;display:flex;align-items:flex-start;gap:12px;font-size:16px}
.summary-list li:last-child{border-bottom:0}
.dot{width:9px;height:9px;flex:0 0 9px;background:var(--teal);border-radius:50%;margin-top:8px}
.progress-row{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(100px,2fr) 50px;align-items:center;gap:12px;font-size:15px;margin:9px 0;cursor:pointer;border-radius:6px;padding:3px 4px}
.progress-row:hover{background:#f2faf9}
.bar-track{height:13px;border-radius:7px;background:#edf3f5;overflow:hidden}.bar-fill{height:100%;background:#168a8d;border-radius:7px}
.explore-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.explore-card{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--border);border-radius:12px;padding:16px;background:#fff;min-height:100px;box-shadow:var(--shadow);width:100%}
.explore-card:hover{background:#f2faf9;border-color:#a7ceca}
.explore-icon{flex:0 0 48px;height:48px;border-radius:10px;background:#e8f5f4;color:#11787f;display:grid;place-items:center}
.explore-icon svg{width:26px;height:26px}
.explore-label{font-size:17px;font-weight:700;color:#274555;margin-bottom:3px}
.explore-detail{font-size:14px;color:#4f6371}
.arrow{color:#49767b;margin-left:auto;font-size:24px}
/* analysis tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{position:relative;text-align:left;border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:150px;width:100%}
.tile:hover{border-color:#a7ceca;background:#fbfefe}
.tile .t-title{font-size:17.5px;font-weight:700;color:#21404f;padding-right:34px}
.tile .t-short{font-size:14.5px;color:#5f7380;flex:1}
.tile .t-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info-btn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid #bcd0d6;background:#f4f9fa;color:#0b6a70;font-weight:800;font-family:Georgia,serif;font-size:15px;display:grid;place-items:center;padding:0}
.info-btn:hover{background:#e3f2f2}
.info-mini{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1px solid #bcd0d6;background:#f4f9fa;color:#0b6a70;font:700 12.5px Georgia,serif;margin-left:6px;vertical-align:1px;cursor:help;flex:none}
.info-mini:hover{background:#e3f2f2}
.status{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.st-ready{background:var(--ok-bg);color:var(--ok)}.st-off{background:var(--grey-bg);color:#5d6b75}.st-soon{background:var(--amber-bg);color:var(--amber)}.st-wait{background:#eef3f9;color:#2f5f8a}
.tile.off{background:#fafbfc}.tile.off .t-title{color:#55666f}
.tag{font-size:12px;padding:3px 8px;border-radius:7px;background:#f1f5f6;color:#3b5a67}
/* tooltip */
#tip{position:fixed;z-index:120;max-width:480px;background:#fff;border:1px solid #c9d8de;border-radius:12px;box-shadow:0 12px 32px rgba(19,45,62,.18);padding:16px 18px;font-size:14.5px;color:#2f4554;display:none;pointer-events:none}
#tip.show{display:block}
#tip h4{margin:0 0 8px;font-size:16.5px;color:#1d3a4c}
#tip .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#5b7685;margin:10px 0 3px}
#tip p{margin:0}
#tip .st{margin-top:10px;font-weight:700}
/* analysis page */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px}
.chip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:help;min-width:120px}
.chip b{display:block;font-size:22px;color:#1d3f52}.chip span{font-size:13px;color:#5f7380}
.viewtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.viewtabs button{border:1px solid #c6d6db;background:#fff;color:#365d6d;border-radius:18px;min-height:38px;padding:6px 14px;font-size:14.5px;font-weight:700}
.viewtabs button.on{color:#075f63;background:var(--teal-light);border-color:#8dc7c4}
.fig{width:100%;min-height:240px}
.tipline{font-size:14px;color:#55717b;background:#f4f8f9;border-radius:8px;padding:9px 12px;margin-top:8px}
ul.notes{margin:0;padding-left:20px}ul.notes li{margin:6px 0;color:#435866}
table.g{border-collapse:collapse;width:100%;font-size:14.5px}
table.g th,table.g td{border-bottom:1px solid #edf0f2;padding:8px 10px;text-align:left;vertical-align:top}
table.g th{background:#f4f7f8;color:#4d6774;font-weight:700;position:sticky;top:0;cursor:help}
table.g tr.click{cursor:pointer}table.g tr.click:hover td{background:#f2faf9}
.tbl{max-height:460px;overflow:auto;border:1px solid var(--border);border-radius:9px}
details.box{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px}
details.box>summary{cursor:pointer;padding:16px 22px;font-size:18px;font-weight:700;color:#243d50;list-style:none;display:flex;align-items:center;gap:10px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary:before{content:"›";font-size:24px;color:#4b7f86;transition:transform .15s;display:inline-block}
details.box[open]>summary:before{transform:rotate(90deg)}
details.box>summary .sub{font-size:14px;color:#6c8190;font-weight:400}
details.box>.inner{padding:0 22px 20px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
.pgrid label{font-size:14px;color:#47616e;display:block;margin-bottom:4px;font-weight:700}
.pgrid input[type=text],.pgrid input[type=number],.pgrid select,.pgrid textarea{width:100%;padding:8px 10px;border:1px solid #b8c9d1;border-radius:8px;background:#fff;min-height:42px}
.howbox p{font-size:15.5px;color:#3b5361}
.msg{padding:16px 18px;border-radius:12px;background:var(--amber-bg);border:1px solid var(--amber-line);font-size:16px;margin:12px 0;color:#5a4614}
.msg.grey{background:#f3f5f7;border-color:#dfe5ea;color:#3f4f5a}.msg.err{background:#fdecee;border-color:#f3c3ca;color:#6b1f2a}
.msg b{display:block;font-size:18px;margin-bottom:4px}
.drop{border:2px dashed #9fc5c6;border-radius:12px;padding:26px;text-align:center;color:#3e626b;background:#f7fcfc;cursor:pointer;font-size:16px}
.drop.over{background:#e8f5f3;border-color:var(--teal)}
.drop b{display:block;font-size:19px;margin-bottom:4px;color:#1f4b55}
.samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.langchip{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.notices{margin:0 0 18px;border-left:5px solid #c98a00;background:#fff8e6}
.notices .nbadge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#c98a00;color:#fff;font-size:12px;text-align:center;vertical-align:middle}
.notice-go{margin-inline-start:6px;vertical-align:baseline}
@media (prefers-color-scheme:dark){.notices{background:#2a2410;color:#e7cd72}.notices .nbadge{background:#8a6d12}}
.explo{margin:0 0 10px;padding:9px 12px;border:1px solid #c9a227;border-left-width:4px;border-radius:6px;background:#fdf8e7;color:#5c4708;font-size:13px;line-height:1.5}
.explo strong{letter-spacing:.03em;text-transform:uppercase;font-size:11px}
@media (prefers-color-scheme:dark){.explo{background:#2a2410;color:#e7cd72;border-color:#8a6d12}}
.langchip.lang-ar{border-color:#c9a227;color:#8a6d12;background:#fdf8e7}
@media (prefers-color-scheme:dark){.langchip.lang-ar{border-color:#8a6d12;color:#e7cd72;background:#2a2410}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.step{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.searchbox{padding:12px 14px;border:1px solid #a9bdc8;border-radius:9px;width:100%;max-width:520px;margin:4px 0 20px;font-size:16px}
.small-print{font-size:13.5px;color:#4f6371}
#busy{position:fixed;inset:0;background:rgba(245,247,249,.6);display:none;align-items:center;justify-content:center;z-index:90}
#busy.on{display:flex}
#busy .in{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 24px;box-shadow:0 8px 24px rgba(0,0,0,.08);font-size:16px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #c9d3de;border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:9px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal-scrim{display:none;position:fixed;z-index:100;inset:0;background:rgba(13,37,51,.45);padding:24px;align-items:center;justify-content:center}
.modal-scrim.open{display:flex}
.modal{background:#fff;border-radius:15px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 10px 35px #162b3c45}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-head h2{font-size:23px;margin:0 0 8px}
.close-modal{border:0;background:#f0f4f5;border-radius:8px;width:42px;height:42px;font-size:22px;flex:none}
.post{border-bottom:1px solid var(--border);padding:12px 0}
.post .m{font-size:13px;color:#4f6371;margin-bottom:4px}
.recent-row{display:flex;flex-wrap:wrap;gap:8px}
.pin-btn{position:absolute;top:12px;right:46px;width:30px;height:30px;border-radius:50%;border:1px solid #d6dde1;background:#fff;color:#8a7a23;font-size:15px;line-height:1;display:grid;place-items:center;padding:0;z-index:2}
.pin-btn.on{background:#fff6dd;border-color:#e2c67a}
details.secblock > summary{cursor:pointer;list-style:none}
details.secblock > summary::-webkit-details-marker{display:none}
details.secblock > summary::before{content:"▾";margin-inline-end:8px;font-size:13px;color:#55636f}
details.secblock:not([open]) > summary::before{content:"▸"}
[dir="rtl"] .pin-btn{right:auto;left:46px}
pre.code{background:#0f2231;color:#e6f0f5;padding:12px 14px;border-radius:8px;overflow:auto;font-size:13px;line-height:1.5;text-align:left}
.study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.study{display:flex;flex-direction:column;gap:4px;text-align:start;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;font:inherit}.study:hover{border-color:var(--teal)}.study b{font-size:16px}.study span{font-size:13.5px;color:#55636f}
ol.steps{display:flex;flex-direction:column;gap:10px;padding-inline-start:26px}ol.steps .tile{max-width:640px}
/* Arabic right-to-left layout, from the v1.5 Arabic and RTL review. Applied only in Arabic; calculations and chart order are unchanged. */
[dir="rtl"] body{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif;text-align:start}
[dir="rtl"] .sidebar{border-right:0;border-left:1px solid var(--border)}
[dir="rtl"] .nav-button,[dir="rtl"] .tile,[dir="rtl"] .explore-card,[dir="rtl"] .hc-row,[dir="rtl"] .study{text-align:right}
[dir="rtl"] .nav-button.active{box-shadow:inset -5px 0 0 var(--sec,var(--teal))}
[dir="rtl"] .nav-count,[dir="rtl"] .arrow{margin-left:0;margin-right:auto}
[dir="rtl"] .arrow{transform:scaleX(-1)}
[dir="rtl"] .tile{border-left:1px solid var(--border);border-right:5px solid var(--sec,var(--border))}
[dir="rtl"] .t-main{padding-inline-end:34px}
[dir="rtl"] .info-btn{right:auto;left:12px}
[dir="rtl"] .info-btn.inline{margin-left:0;margin-right:10px}
[dir="rtl"] .sec-band{border-left:0;border-right:6px solid var(--sec)}
[dir="rtl"] .secblock .section-heading{border-left:0;border-right:5px solid var(--sec);padding-left:0;padding-right:10px}
[dir="rtl"] .menu-list{right:auto;left:0}
[dir="rtl"] .menu-list button{text-align:right}
[dir="rtl"] .crumbs .backbtn{margin-right:0;margin-left:10px}
[dir="rtl"] .quick{margin-inline-start:10px}
[dir="rtl"] .sp-row input,[dir="rtl"] #toolSearch,[dir="rtl"] #hcq{text-align:right}
[dir="rtl"] .post .t{direction:inherit;text-align:start;unicode-bidi:plaintext}
[dir="rtl"] .post .m,[dir="rtl"] .tbl td[dir="auto"]{unicode-bidi:plaintext}
[dir="rtl"] .hc-en-details{direction:rtl;text-align:right}
[dir="rtl"] .hc-en-details > div{direction:ltr;text-align:left;font-family:Arial,Helvetica,sans-serif}
[dir="rtl"] .hc-ar-summary{direction:rtl;text-align:right;line-height:1.9}
[dir="rtl"] .hc-ar-summary h3{margin:12px 0 4px;font-size:16px}
[dir="rtl"] .hc-ar-note{background:#f4f7f9;padding:9px 12px;border-radius:8px}
[dir="rtl"] .fig,[dir="rtl"] .js-plotly-plot,[dir="rtl"] #fullfig{direction:ltr}
[dir="rtl"] .meter{direction:ltr}
[dir="rtl"] .page-title{letter-spacing:0;line-height:1.5}
[dir="rtl"] .appbar,[dir="rtl"] .top-right{direction:rtl}
[dir="rtl"] .basis,[dir="rtl"] .viewnote,[dir="rtl"] .hc-body{line-height:1.8}
[dir="rtl"] #chat{right:auto;left:0;box-shadow:6px 0 24px rgba(19,45,62,.22);transform:translateX(-105%)}
[dir="rtl"] #chat.open{transform:translateX(0)}
[dir="rtl"] pre.code,[dir="rtl"] code{direction:ltr;text-align:left;unicode-bidi:isolate}
[dir="rtl"] .fchip,[dir="rtl"] .qc{text-align:right}
[dir="rtl"] .skip{left:auto;right:-9999px}[dir="rtl"] .skip:focus{right:12px;left:auto}

[dir=rtl] .summary-list li > span:last-child,[dir=rtl] .basis,[dir=rtl] .study span,[dir=rtl] main p,[dir=rtl] main li,[dir=rtl] main td,[dir=rtl] main th,[dir=rtl] #modalBody p,[dir=rtl] #modalBody li,[dir=rtl] #modalBody td,[dir=rtl] .small-print,[dir=rtl] .msg{unicode-bidi:plaintext}

// The page host serves a fixed set of file types, so archives and wheels are stored with an extra ".wasm" suffix.
(() => {
  const realFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const url = typeof input === "string" ? input : (input instanceof URL ? input.href : input.url);
    if (/\.(whl|zip)(\?.*)?$/.test(url) && !/^(blob|data):/.test(url)) return realFetch(url.replace(/(\.(whl|zip))(\?.*)?$/, "$1.wasm$3"), init);
    return realFetch(input, init);
  };
})();

async function boot() {
  try {
    engine("Loading charts");
    await loadScript("plotly.min.js");
    engine("Loading the analysis engine (first visit: about a minute)");
    await loadScript("pyodide/pyodide.js");
    py = await loadPyodide({indexURL: new URL("pyodide/", document.baseURI).href});
    engine("Loading data tools");
    await py.loadPackage(PKGS, {messageCallback: () => {}});
    engine("Loading MARSAD");
    for (const z of ["bundle_py.zip", "marsad.zip"]) py.unpackArchive(await bytes(z), "zip", {extractDir: SITE});
    py.FS.writeFile(SITE + "/plotly/package_data/plotly.min.js", await (await fetch("plotly.min.js")).text());
    py.FS.mkdirTree("/data");
    await py.runPythonAsync(`import sys, warnings\nwarnings.filterwarnings("ignore")\nsys.path.insert(0, "${SITE}")\nfrom marsad_analytics import webapp as W\nfrom marsad_analytics import chat as CH\nfrom marsad_analytics import validate as V\nfrom marsad_analytics import draft as DR`);
    W = py.globals.get("W"); CH = py.globals.get("CH"); VERSION = W.version(); V = py.globals.get("V"); DR = py.globals.get("DR");
    REG = JSON.parse(W.registry_json()); PL = REG.plain;
    engine("Ready", "ready");
    if (LANG === "ar") setLang("ar");
    try { dl = await window.claude?.use?.("downloads"); } catch (e) { dl = null; }
    chatReady();
    render();
  } catch (e) {
    console.error(e);
    engine("Could not start", "err");
    $("#main").insertAdjacentHTML("afterbegin", `<div class="msg err"><b>The analysis engine could not start in this browser.</b>${esc(e.message)}. Please try a recent Chrome, Edge, Firefox or Safari on a computer, or use the MARSAD Colab notebook.</div>`);
  }
}

// ------------------------------------------------------------------ catalogue helpers
function glossCatalog() {
  const en = (PL && PL.gloss) || {};
  if (LANG !== "ar" || !PL?.ar?.gloss) return en;
  return Object.fromEntries(Object.entries(en).map(([id, val]) => [id, [PL.ar.gloss[id] || val[0], val[1]]]));
}
const trUI = t => LANG === "ar" ? (PL?.ar?.ui?.[t] || t) : t;
function sections() { if (!PL) return []; if (LANG !== "ar") return PL.sections; const A = PL.ar.sections; return PL.sections.map(x => A[x.id] ? {...x, title: A[x.id][0], question: A[x.id][1], intro: A[x.id][2]} : x); }
function itemsOf(sec) {
  if (!PL) return [];
  const cards = Object.entries(PL.cards).filter(([, v]) => v.section === sec).map(([id, v]) => ({id, ...v, planned: false}));
  const order = REG.cards.map(c => c.id);
  cards.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  const _out = cards.concat(PL.planned.filter(p => p.section === sec).map(p => ({...p, planned: true})));
  return LANG === "ar" ? _out.map(withAr) : _out;
}
function allItems() { return sections().flatMap(s => itemsOf(s.id)); }
function withAr(i) {
  if (LANG !== "ar" || !PL.ar) return i;
  const names = PL.ar.cards?.[i.id], d = PL.ar.details?.[i.id] || PL.ar.planned?.[i.id];
  return names ? {...i, title: names[0], short: names[1], ...(d || {})} : (d ? {...i, ...d} : i);
}
function regCard(id) { return REG ? REG.cards.find(c => c.id === id) : null; }
function plainOf(id) {
  const p = PL ? (PL.cards[id] || PL.planned.find(x => x.id === id)) : null;
  if (!p || LANG !== "ar" || !PL.ar) return p;
  if (PL.ar.planned?.[id]) return {...p, ...PL.ar.planned[id]};
  const a = PL.ar.cards?.[id]; if (!a) return p;
  return {...p, title: a[0], short: a[1], ...(PL.ar.details?.[id] || {})};
}
function status(item) {
  if (item.planned) return {cls: "st-soon", label: "Planned", why: item.note, ok: false};
  if (!SCAN) return {cls: "st-wait", label: "Load a file", why: "Load a file on the Overview page.", ok: false};
  const c = regCard(item.id) || {};
  if (c.available) return {cls: "st-ready", label: "Ready", why: "", ok: true};
  if (c.runtime_gap) return {cls: "st-soon", label: /own model or API/.test(c.hint || "") ? "Needs MARSAD service" : "Needs MARSAD server", why: plainGap(c), ok: false};
  const need = (c.missing || []).map(m => (LANG === "ar" && PL.ar?.needs?.[m]) || PL.needs[m] || m);
  const why = need.length ? (LANG === "ar" ? "يتطلب " + need.join(" أو ") + "." : "Needs " + need.join(" or ") + ".") : (c.hint || "");
  return {cls: "st-off", label: "Not for this file", why, ok: false};
}
function plainGap(c) {
  const api = /own model or API/.test(c.hint || "");
  if (LANG === "ar") return api ? "يعمل عند ربط خدمة مرصد اللازمة، أو على ملفات تحتوي على هذه التصنيفات مسبقًا."
                                : "يعمل على خادم مرصد أو في دفتر كولاب، أو هنا على ملفات تحتوي على هذه التصنيفات مسبقًا.";
  if (api) return "Runs when the MARSAD service for it is connected, or on files that already include these labels.";
  return "Runs on the MARSAD server or in the Colab notebook, or here on files that already include these labels.";
}

const helpRoute = k => ({page: "help", route: MarsadHelp.routeFromHash(k)});
function fromHash() {
  const h = location.hash.slice(1);

  if (h.startsWith("c-")) return {page: "card", id: h.slice(2)};
  if (h.startsWith("s-")) return {page: "section", section: h.slice(2)};
  if (h.startsWith("q-")) return {page: "study", id: h.slice(2)};
  if (["all", "report", "overview", "files"].includes(h)) return {page: h};
  if (!h) { try {      // come back to the page they left, but never to an analysis page: the file is gone after a reload
    const last = JSON.parse(localStorage.getItem("marsad_last") || "null");

  if (name === "changefile") go({page: "files"});

  if (name === "pickfilesel") { fileSel[el.dataset.id] = el.dataset.file; results[el.dataset.id] = null; cardPage(el.dataset.id); }
  if (name === "splitoff") { params[el.dataset.id] = Object.assign({}, params[el.dataset.id], {[splitKey(el.dataset.id)]: "none"}); results[el.dataset.id] = null; cardPage(el.dataset.id); }
  if (name === "spliton") { params[el.dataset.id] = Object.assign({}, params[el.dataset.id], {[splitKey(el.dataset.id)]: "dataset"}); results[el.dataset.id] = null; cardPage(el.dataset.id); }
  if (name === "pickfile") $("#file").click();
  if (name === "load") loadData();
  if (name === "sample") loadSample(el.dataset.file, el.dataset.name);
  if (name === "save") toggleSave(el.dataset.id);
  if (name === "unsave") { saved.delete(el.dataset.id); render(); }
  if (name === "explain") explain(el.dataset.id);
  if (name === "about") about();
  if (name === "prepare") preparePage();
  if (name === "pin") togglePin(el.dataset.id);
  if (name === "appearance") appearancePage();
  if (name === "customize") customizePage();
  if (name === "filters") filtersPage();
  if (name === "resetfilters") { const n = prepOpts(); FKEYS.forEach(k => delete n[k]); applyPrepare(n); }
  if (name === "resetlook") {
    setBig(false); setContrast(false); setMode("simple");
    return;
  }
  if (name === "moreanalyses") { COREONLY = false; renderSidebar(); render(); return; }
  if (name === "viewmode") { VIEWMODE = VIEWMODE === "simple" ? "full" : "simple"; try { localStorage.setItem("marsad_view", VIEWMODE); } catch (e) {} render(); }
  if (name === "saveproject") saveProject();
  if (name === "studyreport") { const q = PL.studies.find(x => x.id === el.dataset.id); for (const c of q.cards) if (status({...plainOf(c), id: c}).ok && !saved.has(c)) toggleSave(c); render(); }
  if (name === "studydraft") { const q = PL.studies.find(x => x.id === el.dataset.id); draftReport(q.cards.filter(c => status({...plainOf(c), id: c}).ok)); }
  if (name === "openproject") $("#projfile").click();
  if (name === "openposts") showPosts(el.dataset.f, el.dataset.title || "");
}

function render() {
  renderSidebar();
  const m = $("#main");
  if (view.page === "help") { m.innerHTML = MarsadHelp.render(view.route || {view: "home"}); MarsadHelp.bind(m); return; }
  if (!PL || !SCAN && view.page === "overview" || view.page === "files") { m.innerHTML = startPage(); bindStart(); return; }
  if (view.page === "overview") { m.innerHTML = overviewPage(); bindOverview(); }
  else if (view.page === "section") { m.innerHTML = sectionPage(view.section); }

function crumbs(parts, back) {

const stem = n => n.replace(/^practice_/, "").replace(/\.(csv|tsv|txt|xlsx|xls|json|jsonl|ndjson)(\.txt)?$/i, "").replace(/[_-]+/g, " ").trim();
function addFiles(list) {
  for (const f of list) { const r = new FileReader(); r.onload = () => { files.push({name: f.name, label: stem(f.name), data: new Uint8Array(r.result)}); showFiles(); }; r.readAsArrayBuffer(f); }

async function loadData(settings) {
  if (!W || !files.length) return;
  busy(true, "Reading your file"); await tick();
  try {
    try { py.FS.readdir("/data").filter(n => !n.startsWith(".")).forEach(n => py.FS.unlink("/data/" + n)); } catch (e) {}
    const paths = files.map((f, i) => { const p = "/data/" + i + "_" + f.name.replace(/[\\/]/g, "_"); py.FS.writeFile(p, f.data); return p; });
    const labels = files.map(f => (f.label || stem(f.name)).trim() || stem(f.name));
    const st = settings && settings.analysis_tz ? {analysis_tz: settings.analysis_tz, source_tz: settings.source_tz || "UTC", weekend: settings.weekend || "auto"}
      : {analysis_tz: $("#tz")?.value || "Asia/Qatar", source_tz: $("#srctz")?.value || "UTC", weekend: $("#weekend")?.value || "auto"};
    SCAN = JSON.parse(W.load_files(py.toPy(paths), py.toPy(st), $("#platform")?.value || "auto", py.toPy(labels), files.length > 1 ? loadMode : "combine"));
    REG = JSON.parse(W.registry_json()); PL = REG.plain; LEX = JSON.parse(W.lexicon_names());
    for (const k of Object.keys(results)) delete results[k];
    for (const k of Object.keys(params)) delete params[k];
    saved.clear();
    for (const k of Object.keys(fileSel)) delete fileSel[k];
    busy(true, "Preparing your overview"); await tick();
    for (const id of ["TIME-1", "TIME-2", "WORDS-1", "WHO-2", "DATA-4"]) if (regCard(id)?.available) runQuiet(id, COMPARE() && id === "TIME-1" ? (params[id] = {split: "dataset"}) : undefined);
    busy(false); go({page: "overview"});
  } catch (e) { busy(false); console.error(e); alertMsg("Could not read the file: " + pyErr(e)); }
}
function runQuiet(id, p, file) {
  try { results[id] = JSON.parse(W.run_card(id, py.toPy(p || {}), file || null)); } catch (e) { results[id] = {card_id: id, status: "error", message: pyErr(e), tables: {}, extra_figures: {}, explain: {}, table_drill: {}, summary: {}, caveats: []}; }
  return results[id];
}

// ------------------------------------------------------------------ simple or full view
function shownItems(list) {
  const picked = list.filter(i => isShown(i.id));
  const runnable = !SCAN || VIEWMODE === "full" ? picked : picked.filter(i => status(i).ok);
  // Simple and Easy Read open on the core set. Nothing is removed: "More analyses" shows the rest, and
  // Expert never applies this filter.
  if (!COREONLY || !SCAN) return runnable;
  const core = runnable.filter(i => isCore(i.id));
  return core.length ? core : runnable;
}
function coreHiddenCount(list) {
  if (!COREONLY || !SCAN) return 0;
  const runnable = list.filter(i => isShown(i.id)).filter(i => VIEWMODE === "full" || status(i).ok);
  const core = runnable.filter(i => isCore(i.id));
  return core.length ? runnable.length - core.length : 0;
}
function viewToggle(list) {
  if (!SCAN) return "";
  const off = list.filter(i => !isShown(i.id)).length;
  const more = coreHiddenCount(list);
  const hidden = list.length - shownItems(list).length - off - more;
  if (VIEWMODE === "simple" && !hidden && !off && !more) return "";
  // a selection is an editorial choice, so it is stated rather than left for the user to notice
  const c = more ? `${trUI("Showing a starting selection of")} ${shownItems(list).length}. ${more} ${trUI(more === 1 ? "more analysis runs on this file" : "more analyses run on this file")}. ` : "";
  const a = VIEWMODE === "simple" && hidden ? `${hidden} ${hidden === 1 ? "analysis that cannot" : "analyses that cannot"} run on this file ${hidden === 1 ? "is" : "are"} hidden.`
          : (VIEWMODE === "full" ? "Showing every analysis, including those that cannot run on this file." : "");
  const b = off ? ` ${off} ${off === 1 ? "analysis is" : "analyses are"} switched off in Customize.` : "";
  const m = more ? `<button class="lnk" data-act="moreanalyses">${trUI("More analyses")}</button> ` : "";
  return `<p class="small-print viewnote">${c}${a}${b} ${m}<button class="lnk" data-act="viewmode">${VIEWMODE === "simple" ? "Show all" : "Show only those that can run"}</button> <button class="lnk" data-act="customize">Customize</button></p>`;
}

// ------------------------------------------------------------------ Arabic interface
// #chatlog is skipped so that the user's own words and the posts quoted back to them are never rewritten.
// The note and the preset questions sit outside the log and do translate.
const TR_SKIP = ".post .t, .post .m, #chatlog, .tbl tbody, .js-plotly-plot, .hc-en-details, pre.code, textarea, [data-notr]";
const TR_DONE = [];
function trText(t) {
  if (!PL || !PL.ar) return null;
  const k = t.trim(); if (!k) return null;
  const U = PL.ar.ui; if (U[k]) return t.replace(k, U[k]);
  for (const [re, out] of PL.ar.patterns) { const m = k.match(new RegExp(re)); if (m) { const g = m.slice(1).map(x => U[x] || x); return t.replace(k, out.replace(/\{(\d)\}/g, (_, i) => g[+i])); } }
  return null;
}
function trNode(root) {
  if (LANG !== "ar" || !PL) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n = root;
  while (n) {
    if (n.nodeType === 1) {
      if (n.matches && n.matches(TR_SKIP)) { n = skipSub(w, n); continue; }
      for (const a of ["title", "placeholder", "aria-label", "data-tip"]) { const v = n.getAttribute && n.getAttribute(a); if (v) { const t = trText(v); if (t && t !== v) { TR_DONE.push([n, a, v]); n.setAttribute(a, t); } } }
    } else if (n.nodeType === 3) { const t = trText(n.nodeValue); if (t && t !== n.nodeValue) { TR_DONE.push([n, null, n.nodeValue]); n.nodeValue = t; } }
    n = w.nextNode();
  }
}
function skipSub(w, el) { let x = el; while (x && !x.nextSibling && x !== document.body) x = x.parentNode; if (!x || x === document.body) return null; w.currentNode = x.nextSibling; return x.nextSibling; }
const TR_OBS = new MutationObserver(ms => { if (LANG !== "ar") return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1 || n.nodeType === 3) { if (n.nodeType === 1 && n.closest && n.closest(TR_SKIP)) continue; if (n.nodeType === 3 && n.parentElement && n.parentElement.closest(TR_SKIP)) continue; trNode(n); } });
function setLang(l) {
  LANG = l; try { localStorage.setItem("marsad_lang", l); } catch (e) {}
  document.documentElement.lang = l === "ar" ? "ar" : "en"; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  const b = $("#langbtn"); b.textContent = l === "ar" ? "English" : "العربية"; b.lang = l === "ar" ? "en" : "ar"; b.title = l === "ar" ? "Show the menus in English" : "Show the menus in Arabic";
  renderModeSel();
  if (l === "ar") { TR_OBS.observe(document.body, {childList: true, subtree: true}); }
  else { TR_OBS.disconnect(); for (const [n, a, v] of TR_DONE.splice(0)) { if (a) n.setAttribute(a, v); else n.nodeValue = v; } }
  if (PL) { renderSidebar(); render(); } if (l === "ar") trNode(document.body);
}
$("#langbtn").onclick = () => setLang(LANG === "ar" ? "en" : "ar");

async function draftReport(ids) {
  if (!SCAN) return;
  busy(true, "Writing a draft from your results"); await tick();
  let d; try { d = JSON.parse(DR.draft(JSON.stringify(ids || [...saved]))); } catch (e) { busy(false); $("#repmsg").textContent = "Could not write the draft: " + pyErr(e); return; }
  busy(false);
  const useClaude = !!SAMPLE;
  modal("Draft report", `<p>The draft has ${d.facts.findings.length} findings, built only from MARSAD's numbers. ${useClaude ? "Claude can also write a short paragraph for each finding from the same numbers. Paragraphs that use a number not in the results are left out." : ""}</p>
    <div class="opt-actions" style="gap:8px">${useClaude ? `<button class="btn primary" id="dr-claude">Add paragraphs by Claude</button>` : ""}<button class="btn ${useClaude ? "" : "primary"}" id="dr-html">Download (web page)</button><button class="btn" id="dr-md">Download (Markdown)</button><button class="btn" id="dr-print">Print or save as PDF</button></div><div class="small-print" id="dr-msg"></div>`);
  let html = d.html;
  const dm = $("#repmsg"); if (dm) dm.textContent = "";
  $("#dr-html").onclick = () => save("marsad_draft_report.html", html, $("#dr-msg"));
  $("#dr-md").onclick = () => save("marsad_draft_report.md", d.markdown, $("#dr-msg"));
  $("#dr-print").onclick = () => printHTML(html, $("#dr-msg"));
  const cb = $("#dr-claude"); if (cb) cb.onclick = async () => {
    $("#dr-msg").textContent = "Claude is writing…"; cb.disabled = true;
    const facts = d.facts.findings.map(f => ({id: f.id, title: f.title, question: f.question, numbers: f.numbers, check: f.check, table: f.table, caveats: f.caveats}));
    const prompt = `You write the findings section of a research report on social media posts. For each finding below, write one short paragraph (2 to 4 sentences) in plain English that says what the numbers show. Rules: use only numbers that appear in that finding, written exactly as given; add no new numbers, causes or claims; mention the main limit if one is given; no em dashes; do not use the words "delve", "notably" or "crucial". Answer with JSON only: {"<id>": "<paragraph>", ...}.\n\nData: ${JSON.stringify(d.facts.data)}\n\nFindings: ${JSON.stringify(facts)}`;
    try {
      const res = await SAMPLE([{role: "user", content: prompt}], {cache: false, modelTier: "default"});
      const t = (res?.text || "").replace(/^```(json)?/m, "").replace(/```\s*$/m, "");
      const pr = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
      const o = JSON.parse(DR.with_prose(JSON.stringify(d.facts), JSON.stringify(pr)));
      html = o.html;
      $("#dr-msg").textContent = `Claude wrote ${o.kept.length} paragraphs.` + (o.dropped.length ? ` ${o.dropped.length} left out because they used a number not in the results.` : "") + " Download the web page to read them.";
    } catch (e) { $("#dr-msg").textContent = "Claude could not write the paragraphs (" + (e?.message || e?.code || "error") + "). The draft without them is ready to download."; }
    cb.disabled = false;
  };
}

function printHTML(html, msgEl) {
  try {
    const fr = document.createElement("iframe"); fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0"; document.body.appendChild(fr);
    fr.onload = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { if (msgEl) msgEl.textContent = "Printing is blocked here. Download the web page, open it and use its Print or save as PDF button."; } setTimeout(() => fr.remove(), 60000); };
    fr.srcdoc = html;
  } catch (e) { if (msgEl) msgEl.textContent = "Printing is blocked here. Download the web page, open it and use its Print or save as PDF button."; }
}

const PROJECT_DATA_LIMIT = 25e6;
function u8b64(u) { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

    <p class="small-print">Anyone you send a project with data can read every post in it.</p>

      settings: SCAN ? SCAN.settings : {}, load_mode: loadMode, prepared: (SCAN && SCAN.prepared && SCAN.prepared.options) || {},
      params, report: [...saved], custom: {preset: CUSTOM.preset, hidden: CUSTOM.hidden, pinned: CUSTOM.pinned}, checks: Object.fromEntries(Object.entries(CHK).filter(([, c]) => c.judged && c.judged.length).map(([k, c]) => [k, {file: c.file, judged: c.judged.map(j => ({...j, post_id: CHKPID(j.row, c.file)}))}])),
      files: files.map(f => ({name: f.name, label: f.label, size: f.data.length, ...(withData ? {data: u8b64(f.data)} : {})}))};
    save(`marsad_project_${new Date().toISOString().slice(0, 10)}.marsad.json`, JSON.stringify(p), $("#pj-msg"));
  };
}
function CHKPID(row, file) { try { return JSON.parse(V.post_ids(JSON.stringify([row]), file || ""))[0]; } catch (e) { return null; } }
const PROJECT = {notes: ""};
async function openProject(file) {
  let p; try { p = JSON.parse(await file.text()); } catch (e) { alertMsg("This is not a MARSAD project file."); return; }
  if (!p.marsad_project) { alertMsg("This is not a MARSAD project file."); return; }
  PROJECT.notes = p.notes || "";
  const missing = (p.files || []).filter(f => !f.data && !files.some(x => x.name === f.name));
  if (missing.length) { PROJECT.pending = p; go({page: "files"}); alertMsg(`This project was saved without its data. Add ${missing.map(f => f.name).join(", ")} below, then open the project again.`); return; }
  const keep = files.filter(x => (p.files || []).some(f => f.name === x.name && !f.data));
  files.length = 0; files.push(...keep);
  for (const f of p.files || []) { if (f.data) files.push({name: f.name, label: f.label, data: b64(f.data)}); }
  loadMode = p.load_mode || "combine";
  await loadData(p.settings);
  try {
    if (p.prepared && Object.keys(p.prepared).length) { SCAN = JSON.parse(W.prepare(py.toPy(p.prepared))); REG = JSON.parse(W.registry_json()); PL = REG.plain; for (const k of Object.keys(results)) delete results[k]; }
    Object.assign(params, p.params || {});
    if (p.custom) { Object.assign(CUSTOM, p.custom); saveCustom(); }
    for (const id of p.report || []) if (regCard(id)) { saved.add(id); }
    for (const [id, c] of Object.entries(p.checks || {})) {
      runQuiet(id, params[id], c.file);
      const rows = JSON.parse(V.rows_for(JSON.stringify(c.judged.map(j => j.post_id)), c.file || ""));
      const J = c.judged.map((j, i) => ({...j, row: rows[i] ?? j.row})).filter(j => j.row != null);
      V.score(id, JSON.stringify(J), c.file || ""); CHK[id] = {file: c.file, judged: J}; results[id] = null;
    }
  } catch (e) { alertMsg("The project opened, but some settings could not be restored: " + pyErr(e)); }
  go({page: "overview"});
}

function testDiff(id, a, b) {

  const pick = (v, nm) => `<select id="td-${nm}">${o.files.map(f => `<option ${f === v ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>`;
  const rows = o.rows.map(x => `<tr class="${x.clear_difference ? "hit" : ""}"><td dir="auto">${esc(x.part)}</td><td>${fmt(x["share_" + o.a + "_%"])}%</td><td>${fmt(x["share_" + o.b + "_%"])}%</td><td>${x.difference_points > 0 ? "+" : ""}${fmt(x.difference_points)} (${fmt(x.low)} to ${fmt(x.high)})</td><td>${x.p_holm < 0.001 ? "< 0.001" : fmt(x.p_holm)}</td><td>${esc(x.effect_size)} (${fmt(x.effect_h)})</td><td>${x.clear_difference ? "Yes" : "No"}</td></tr>`).join("");
  const clear = o.rows.filter(x => x.clear_difference).length;

    <p><b>${clear ? clear + " of " + o.rows.length + " parts show a clear difference" : "No part shows a clear difference"}</b> between ${esc(o.a)} (${fmt(o.posts_a)} posts) and ${esc(o.b)} (${fmt(o.posts_b)} posts).</p>
    <div class="tbl"><table class="g"><thead><tr><th>Part</th><th>${esc(o.a)}</th><th>${esc(o.b)}</th><th>Difference, points (range)</th><th>p (corrected)</th><th>Effect size</th><th>Clear difference</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small-print">${esc(o.note)}</p>
    <div class="opt-actions"><button class="btn" id="td-csv">Download (CSV)</button></div><div class="small-print" id="td-msg"></div>`);
  const g = $("#td-go"); if (g) g.onclick = () => testDiff(id, $("#td-a").value, $("#td-b").value);

}

function checkSample(id, filter, name, n) {
  const c = CHK[id];
  let d; try { d = JSON.parse(V.sample(id, filter, Math.min(200, Math.max(5, n)), 7, c.file)); } catch (e) { $("#modalBody").innerHTML = `<div class="msg err">${esc(pyErr(e))}</div>`; return; }
  c.posts = d.posts; c.target = filter ? name : "";
  if (!d.posts.length) { $("#modalBody").innerHTML = `<p>No posts found for this part of the result.</p>`; return; }
  const lab = !!(c.task && c.labels.length);
  const q = lab ? "What is the right label for each post? Choose Unsure if you cannot tell." : `Does each post really belong to <b dir="auto">${esc(name)}</b>?`;
  const row = (p, i) => `<div class="post chk" data-i="${i}"><div class="m">${esc([p.author, lab && p.label ? "MARSAD says: " + p.label : ""].filter(Boolean).join(" · "))}</div><div class="t" dir="auto">${esc(p.text)}</div>
    <div class="chk-a">${lab ? `<select data-i="${i}" aria-label="Right label for post ${i + 1}">${c.labels.map(l => `<option ${l === p.label ? "selected" : ""}>${esc(l)}</option>`).join("")}<option value="__unsure">Unsure</option></select>`
      : `<label><input type="radio" name="v${i}" value="yes"> Yes</label><label><input type="radio" name="v${i}" value="no"> No</label><label><input type="radio" name="v${i}" value="unsure" checked> Unsure</label>`}</div></div>`;
  $("#modalTitle").textContent = `Check: ${d.posts.length} posts`;
  $("#modalBody").innerHTML = `<p>${q}</p>${d.posts.map(row).join("")}<div class="opt-actions" style="gap:8px"><button class="btn primary" id="chk-score">Score my answers</button></div>`;
  $("#chk-score").onclick = () => checkScore(id);
}
function checkScore(id) {
  const c = CHK[id], lab = !!(c.task && c.labels.length);
  const J = c.posts.map((p, i) => {
    const base = {row: p.row, target: c.target || p.label || "all", label: p.label ?? null};
    if (lab) { const v = document.querySelector(`select[data-i="${i}"]`).value; return v === "__unsure" ? {...base, verdict: "unsure"} : {...base, verdict: v === p.label ? "yes" : "no", true_label: v}; }
    const v = (document.querySelector(`input[name="v${i}"]:checked`) || {}).value || "unsure"; return {...base, verdict: v};
  });
  c.judged = J;
  let o; try { o = JSON.parse(V.score(id, JSON.stringify(J), c.file)); } catch (e) { $("#modalBody").innerHTML = `<div class="msg err">${esc(pyErr(e))}</div>`; return; }
  const ov = o.overall;
  const tr = o.targets.map(t => `<tr><td dir="auto">${esc(t.target)}</td><td>${t.checked}</td><td>${t.right}</td><td>${t["precision_%"]}%</td><td>${t["low_%"]} to ${t["high_%"]}%</td></tr>`).join("");
  const cr = o.corrected ? `<h3 class="mh">Corrected share of each label in your whole file</h3><table class="g"><thead><tr><th>Label</th><th>MARSAD's share</th><th>Corrected share</th><th>Range</th></tr></thead><tbody>${o.corrected.rows.map(x => `<tr><td dir="auto">${esc(x.label)}</td><td>${x["observed_%"]}%</td><td>${x["corrected_%"]}%</td><td>${x["low_%"]} to ${x["high_%"]}%</td></tr>`).join("")}</tbody></table>
    <p class="small-print">${esc(o.corrected.method)}${o.corrected.labels_not_checked.length ? " Labels with no checked posts are taken as right: " + esc(o.corrected.labels_not_checked.join(", ")) + "." : ""}</p>` : "";
  $("#modalTitle").textContent = "Your check";
  $("#modalBody").innerHTML = ov ? `<p>You marked <b>${ov.checked}</b> posts (Unsure answers are left out). MARSAD was right on <b>${ov.right}</b>: <b>${ov["precision_%"]}%</b>, likely between ${ov["low_%"]}% and ${ov["high_%"]}% for all such posts in your file.</p>
    ${o.targets.length > 1 ? `<table class="g"><thead><tr><th>Part</th><th>Checked</th><th>Right</th><th>Share right</th><th>Range</th></tr></thead><tbody>${tr}</tbody></table>` : ""}${cr}
    <p class="small-print">A share right below about 70% means this result should be reported with care, or not at all, for these posts.${o.corrected ? " The corrected shares now also appear in the result's table." : ""}</p>
    <div class="opt-actions" style="gap:8px"><button class="btn" id="chk-csv">Download my answers (CSV)</button><button class="btn" id="chk-more">Check more posts</button><button class="btn primary" id="chk-done">Done</button></div><div class="small-print" id="chk-msg"></div>`
    : `<p>All answers were Unsure, so there is nothing to score.</p><div class="opt-actions"><button class="btn" id="chk-more">Try again</button></div>`;
  const cv = $("#chk-csv"); if (cv) cv.onclick = () => save(`marsad_check_${id}.csv`, V.judgments_csv(JSON.stringify(J), c.file), $("#chk-msg"));
  $("#chk-more").onclick = () => checkStart(id, results[id]);
  const dn = $("#chk-done"); if (dn) dn.onclick = async () => { closeModal(); if (o.corrected) { results[id] = null; await cardPage(id); } };
}

function showPosts(filter, title, sort, seed) {
  sort = sort || POSTSORT; POSTSORT = sort;

  try { ex = JSON.parse(W.examples(filter, 20, sort, file, seed || 0)); } catch (e) { ex = {n_matching: 0, posts: [], error: pyErr(e)}; }
  const SORTS = [["interactions", "Most engagement"], ["random", "Random"], ["recent", "Newest"], ["oldest", "Oldest"]];

    `<div class="postbar"><label>Order <select id="ps-sort">${SORTS.map(([v, l]) => `<option value="${v}" ${v === sort ? "selected" : ""}>${l}</option>`).join("")}</select></label>${sort === "random" ? `<button class="btn small" id="ps-again">Another random set</button>` : ""}${ex.n_matching ? `<button class="btn small" id="ps-csv">Download all ${fmt(ex.n_matching)} (CSV)</button>` : ""}<span class="small-print" id="ps-msg"></span></div>` +
    (ex.n_matching > ex.posts.length ? `<p class="small-print">${ex.posts.length} of ${fmt(ex.n_matching)}, ${what}. Repeated texts are shown once.${sort === "interactions" ? " The most engaged posts are not typical posts: choose Random to see typical ones." : ""}</p>` : "") +
    (ex.posts.length ? ex.posts.map((p, i) => `<div class="post"><div class="m">${[p.author, p.created_local, p.platform, p.interactions != null ? fmt(p.interactions) + " engagement" : ""].filter(Boolean).map(esc).join(" · ")}${p.url ? ` · <a href="${esc(p.url)}" target="_blank" rel="noopener">open</a>` : ""} · <button class="text-button" data-copy="${i}">copy</button></div><div class="t" dir="${p.dir || "auto"}">${p.text_html || esc(p.text)}</div></div>`).join("") : `<p>No posts behind this point.</p>`));

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { const t = ex.posts[+b.dataset.copy].text; try { navigator.clipboard.writeText(t).then(() => b.textContent = "copied", () => b.textContent = "copy blocked"); } catch (e) { b.textContent = "copy blocked"; } });

`);

function b64(s) { const x = atob(s), u = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) u[i] = x.charCodeAt(i); return u; }
async function save(filename, data, msgEl) {
  if (!dl) { try { dl = await window.claude?.use?.("downloads"); } catch (e) {} }
  if (dl) {
    try { await dl.save({filename, data}); if (msgEl) msgEl.textContent = "Saved " + filename; }
    catch (e) { if (msgEl) msgEl.textContent = e && e.code === "declined" ? "Download cancelled." : "Could not save: " + (e.message || e.code || e); }
    return;
  }
  // outside Claude (GitHub Pages, a MARSAD server): a normal browser download
  try {
    const type = /\.html?$/i.test(filename) ? "text/html" : /\.svg$/i.test(filename) ? "image/svg+xml" : /\.csv$/i.test(filename) ? "text/csv" : "application/octet-stream";
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (msgEl) msgEl.textContent = "Saved " + filename;
  } catch (e) { if (msgEl) msgEl.textContent = "Could not save: " + (e.message || e); }
}
async function download(id, r, kind, figs) {
  const msg = $("#dlmsg"); msg.textContent = "";
  try {
    if (kind === "png" || kind === "svg") {
      const el = $("#cardfig");
      const url = await Plotly.toImage(el, {format: kind, width: 1200, height: Math.max(500, el.clientHeight || 500), scale: kind === "png" ? 2 : 1});
      const name = `${(plainOf(id)?.title || id).replace(/[^\w\- ]+/g, "").trim().replace(/ +/g, "_")}${figIdx ? "_" + figs[figIdx][0].replace("figure:", "") : ""}.${kind}`;
      await save(name, kind === "png" ? b64(url.split(",")[1]) : decodeURIComponent(url.split(",")[1]), msg); return;
    }
    busy(true, "Preparing the file"); await tick();
    const d = JSON.parse(W.download(id, kind, null)); busy(false);
    await save(d.filename, b64(d.data), msg);
  } catch (e) { busy(false); msg.textContent = "Could not prepare the file: " + pyErr(e); }
}

// ------------------------------------------------------------------ Ask MARSAD (chat)
const CHAT = {history: [], busy: false, abort: null, mode: "local"};
const CHAT_SUGG = ["What are the main findings?", "Who are the most active accounts?", "Why was there a spike?",
                   "Is the sentiment positive or negative?", "Which news frames dominate?", "ما أكثر الكلمات استخداما؟"];
function chatOpen(on) {
  const c = $("#chat"); c.classList.toggle("open", on); c.setAttribute("aria-hidden", on ? "false" : "true"); c.inert = !on; if (!on) $("#chatbtn").focus();
  if (on) { chatNote(); if (!CHAT.history.length) chatWelcome(); setTimeout(() => $("#chatin").focus(), 50); }
}
async function chatReady() {
  try { SAMPLE = await window.claude?.use?.("sample"); } catch (e) { SAMPLE = null; }
  CHAT.mode = SAMPLE ? "claude" : "local"; chatNote();
}
function chatNote() {
  const n = $("#chatnote"); if (!n) return;
  n.innerHTML = CHAT.mode === "claude"
    ? "Answers are written by Claude from MARSAD's results for your file. Your question, the results it looks up and up to 8 quoted posts are sent to Claude; your file itself is not uploaded. Check important numbers in the analysis it names."
    : "Simple answers: Ask MARSAD points you to the analyses that answer your question and shows their key numbers. Full written answers are available when MARSAD is opened in Claude.";
}
function chatWelcome() {
  chatAdd("a", SCAN ? `Your file has ${fmt(SCAN.posts)} posts. Ask me what you want to know about them.`
                    : "Load a file on the Overview page first, then ask me about it. I can also explain how any analysis works.");
  $("#chatsugg").innerHTML = CHAT_SUGG.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("");
}
function chatLinkify(html) {
  const ids = new Set((REG?.cards || []).map(c => c.id));
  return html.replace(/\b([A-Z]{3,7}-\d{1,2})\b/g, (m, id) => ids.has(id) ? `<button class="cid" data-go="c-${id}">${id}</button>` : m);
}
function chatMd(t) {
  let h = esc(t || "");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[-*] (.+)$/gm, "&bull; $1").replace(/\n/g, "<br>");
  return chatLinkify(h);
}
function chatAdd(role, text, extra) {
  const d = document.createElement("div"); d.className = "m " + (role === "u" ? "u" : "a"); d.dir = "auto";
  d.innerHTML = role === "u" ? esc(text) : chatMd(text) + (extra || "");
  $("#chatlog").appendChild(d); $("#chatlog").scrollTop = 1e9; return d;
}
async function chatSend(q) {
  q = (q || "").trim(); if (!q || CHAT.busy) return;
  $("#chatin").value = ""; $("#chatsugg").innerHTML = "";
  chatAdd("u", q); CHAT.busy = true; $("#chatsend").disabled = true;
  try { if (CHAT.mode === "claude" && SAMPLE) await chatClaude(q); else chatLocal(q); }
  finally { CHAT.busy = false; $("#chatsend").disabled = false; }
}
function chatLocal(q) {
  if (!CH) { chatAdd("a", "The analysis engine is still starting. Try again in a moment."); return; }
  let r; try { r = JSON.parse(CH.local_answer(q)); } catch (e) { r = {analyses: []}; }
  if (!r.analyses.length) { chatAdd("a", "I could not match that to an analysis. Try words such as sentiment, accounts, hashtags, spike, frames, offensive or dialect, or browse All analyses."); return; }
  const parts = r.analyses.map(a => {
    const nums = a.key_numbers ? Object.entries(a.key_numbers).filter(([k, v]) => v !== null && typeof v !== "object").slice(0, 4)
      .map(([k, v]) => `${esc(k.replace(/_/g, " "))}: <b>${typeof v === "number" ? fmt(Math.round(v * 10) / 10) : esc(String(v))}</b>`).join(", ") : "";
    return `<div style="margin-top:8px"><button class="cid" data-go="c-${a.id}">${esc(a.title)}</button> (${a.id}): ${esc(a.what)}${nums ? "<br>" + nums : "<br><i>Open it to see the result.</i>"}</div>`;
  }).join("");
  chatAdd("a", "These analyses answer your question:", parts);
}
async function chatClaude(q) {
  const specs = JSON.parse(CH.tool_specs());
  const used = [];
  const tools = specs.map(t => ({name: t.name, description: t.description, inputSchema: t.inputSchema,
    execute: async (input) => { used.push(t.name === "run_analysis" ? (input?.card_id || "") : t.name.replace(/_/g, " "));
      busy(true, "Looking up results"); await tick(); try { return CH.call(t.name, JSON.stringify(input || {})); } finally { busy(false); } }}));
  CHAT.history.push({role: "user", content: q});
  const msgs = CHAT.history.map((m, i) => i === 0 ? {role: "user", content: CH.SYSTEM + "\n\nUser question:\n" + m.content} : m);
  const box = chatAdd("a", "Thinking…");
  CHAT.abort = new AbortController();
  try {
    const res = await SAMPLE(msgs, {tools, cache: false, modelTier: "default", signal: CHAT.abort.signal,
      onText: ({text}) => { box.innerHTML = chatMd(text); $("#chatlog").scrollTop = 1e9; }});
    const text = res?.text || "";
    box.innerHTML = chatMd(text) + (used.length ? `<div class="tools">Looked up: ${chatLinkify(esc([...new Set(used)].join(", ")))}</div>` : "");
    CHAT.history.push({role: "assistant", content: text});
  } catch (e) {
    CHAT.history.pop();
    if (e?.code === "not_granted") { CHAT.mode = "local"; chatNote(); box.remove(); chatLocal(q); return; }
    box.innerHTML = e?.code === "rate_limited" ? "Too many questions in a short time. Please wait a minute and ask again."
      : "Sorry, I could not answer that (" + esc(e?.message || "error") + ").";
  }
}
$("#chatbtn").onclick = () => chatOpen(!$("#chat").classList.contains("open"));
$("#chatclose").onclick = () => chatOpen(false);
$("#chatnew").onclick = () => { CHAT.history = []; $("#chatlog").innerHTML = ""; chatWelcome(); };
$("#chatform").onsubmit = e => { e.preventDefault(); chatSend($("#chatin").value); };
$("#chatin").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend($("#chatin").value); } });
